[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/parsers",
    "crates/ui",
]

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
